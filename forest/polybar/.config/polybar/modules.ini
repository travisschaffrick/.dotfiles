
#################################################################
################                i3               ################
#################################################################
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true

label-focused            = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding    = 2

label-unfocused         = %name%
label-unfocused-padding = 2

label-urgent            = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding    = 2

#################################################################
################             CLOCK               ################
#################################################################
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %b %d

label = "  %date%  "
label-foreground = ${colors.foreground}
label-background = ${gradient.grad-color-1}
label-font = 4
#################################################################
################               CPU               ################
#################################################################
[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "   "
label = "%percentage:2%%"

format-prefix-foreground = ${colors.yellow}

#################################################################
################             MEMORY              ################
#################################################################
[module/memory]
type = internal/memory
interval = 2
format-prefix = "  󰳆 "
format-prefix-foreground = ${colors.yellow}
label = "%percentage_used:2%%"

#################################################################
################          PULSE AUDIO            ################
#################################################################
[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.yellow}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-padding-right = ${padding.modules}
label-volume-padding-left = 1

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol &

#################################################################
################              MEDIA              ################
#################################################################
[module/media]
type = custom/script
exec = playerctl metadata --format "{{ emoji(status) }} {{ artist }} - {{ title }}" 2>/dev/null || echo ""
interval = 2
label = %output:0:60:…%
click-left = playerctl play-pause
click-right = playerctl next

#################################################################
################           XWORKSPACES           ################
#################################################################
[module/xworkspaces]
type = internal/xworkspaces

; Only show workspaces on the monitor this bar is on
pin-workspaces = true

; Sort workspaces by number
index-sort = true

; Enable scroll to cycle workspaces
enable-scroll = true

; Labels
label-active = %name%
label-active-background = ${colors.background}
label-active-foreground = ${colors.yellow}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

hook-0 = %{B#ff5555}  ; red-ish background on notification
hook-1 = %{B-}        ; reset background

[module/text1]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-1}
content-background = ${gradient.grad-color-2}
content-font = 3

[module/text2]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-1}
content-background = ${gradient.grad-color-2}
content-font = 3

[module/text3]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-2}
content-background = ${gradient.grad-color-3}
content-font = 3

[module/text4]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-2}
content-background = ${gradient.grad-color-3}
content-font = 3

[module/text5]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-3}
content-font = 3

[module/text6]
type = custom/text
content = ""
content-foreground = ${gradient.grad-color-3}
content-font = 3

