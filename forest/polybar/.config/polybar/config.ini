include-file = ~/.dotfiles/forest/polybar/.config/polybar/modules.ini
include-file = ~/.dotfiles/forest/polybar/.config/polybar/theme.ini


#################################################################
################            MAIN BAR             ################
#################################################################
[bar/main]
monitor = ${env:MONITOR:}

height = 22
width = 100%
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
padding-left = 2
padding-right = 2

font-0 = JetBrainsMono Nerd Font:size=12;2
font-1 = JetBrainsMono Nerd Font:size=12;3

modules-left   = xworkspaces
modules-center = text5 text3 text1 date text2 text4 text6
modules-right  = pulseaudio cpu memory media

tray-position = none
cursor-click = pointer
cursor-scroll = ns-resize

#################################################################
################          SECONDARY BAR          ################
#################################################################
[bar/secondary]
inherit = bar/main
monitor = ${env:MONITOR2:}
tray-position = right
