include-file = ~/.dotfiles/polybar/.config/polybar/modules.ini
include-file = ~/.dotfiles/polybar/.config/polybar/theme.ini


#################################################################
################            MAIN BAR             ################
#################################################################
[bar/main]
monitor = ${env:MONITOR:}

height = 32
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=14;3

modules-left   = date
modules-center = i3
modules-right  = cpu memory pulseaudio media

tray-position = none
cursor-click = pointer
cursor-scroll = ns-resize

#################################################################
################          SECONDARY BAR          ################
#################################################################
[bar/secondary]
inherit = bar/main
monitor = ${env:MONITOR2:}
tray-position = right
modules-left   = date
modules-center = i3
modules-right  = cpu memory pulseaudio
